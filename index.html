<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SVSV Photo Editor</title>
    <style>
        /* --- CSS DESIGN --- */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { display: flex; align-items: center; justify-content: center; min-height: 100vh; background: #121212; color: #ffffff; }
        .container { width: 850px; padding: 30px; background: #242424; border-radius: 10px; box-shadow: 0 10px 20px rgba(0,0,0,0.5); }
        .container h2 { margin-bottom: 20px; font-size: 22px; font-weight: 600; text-align: center; color: #4A98F7; letter-spacing: 2px;}
        .wrapper { display: flex; gap: 20px; }
        .editor-panel { width: 280px; padding: 15px 0; }
        .title { display: block; font-size: 16px; margin-bottom: 12px; font-weight: bold; }
        .options { display: flex; flex-wrap: wrap; gap: 10px; }
        .options button { width: calc(50% - 5px); padding: 10px; font-size: 14px; background: #3a3a3a; color: #fff; border: 1px solid #4a4a4a; border-radius: 5px; cursor: pointer; transition: 0.3s; }
        .options button:hover { background: #4A98F7; border-color: #4A98F7; }
        .options button.active { background: #4A98F7; border-color: #4A98F7; font-weight: bold; }
        .slider { margin-top: 20px; }
        .filter-info { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 14px; }
        .slider input { width: 100%; height: 5px; accent-color: #4A98F7; cursor: pointer; }
        .preview-img { flex-grow: 1; display: flex; align-items: center; justify-content: center; overflow: hidden; background: #1a1a1a; border-radius: 5px; min-height: 400px; border: 2px dashed #4a4a4a; }
        .preview-img img { max-width: 100%; max-height: 100%; object-fit: contain; }
        .preview-text { color: #888; position: absolute; pointer-events: none; }
        .controls { display: flex; justify-content: space-between; align-items: center; margin-top: 20px; padding-top: 20px; border-top: 1px solid #4a4a4a; }
        .controls button { padding: 11px 20px; font-size: 14px; border-radius: 5px; cursor: pointer; color: #fff; background: #3a3a3a; border: 1px solid #4a4a4a; font-weight: bold; transition: 0.3s;}
        .controls button:hover { background: #555; }
        .controls .row { display: flex; gap: 10px; }
        .controls .row .save-img { background: #4A98F7; border-color: #4A98F7; }
        .controls .row .save-img:hover { background: #3b7ddb; }
        .disable .preview-text { display: none; }
        .disable .preview-img { border: none; }
    </style>
</head>
<body>

    <div class="container">
        <h2>SVSV PHOTO EDITOR</h2>
        <div class="wrapper">
            <div class="editor-panel">
                <div class="filter">
                    <label class="title">Filters</label>
                    <div class="options">
                        <button id="brightness" class="active">Brightness</button>
                        <button id="saturation">Saturation</button>
                        <button id="inversion">Inversion</button>
                        <button id="grayscale">Grayscale</button>
                    </div>
                    <div class="slider">
                        <div class="filter-info">
                            <p class="name">Brightness</p>
                            <p class="value">100%</p>
                        </div>
                        <input type="range" value="100" min="0" max="200">
                    </div>
                </div>
            </div>
            <div class="preview-img">
                <span class="preview-text">Choose an image to start editing</span>
                <img src="" alt="" id="image">
            </div>
        </div>
        <div class="controls">
            <button class="reset-filter">Reset Filters</button>
            <div class="row">
                <input type="file" class="file-input" accept="image/*" hidden>
                <button class="choose-img">Choose Image</button>
                <button class="save-img">Save Image</button>
            </div>
        </div>
    </div>

    <script>
        const fileInput = document.querySelector(".file-input"),
        filterOptions = document.querySelectorAll(".filter button"),
        filterName = document.querySelector(".filter-info .name"),
        filterValue = document.querySelector(".filter-info .value"),
        filterSlider = document.querySelector(".slider input"),
        previewImg = document.querySelector(".preview-img img"),
        container = document.querySelector(".container"),
        chooseImgBtn = document.querySelector(".choose-img"),
        saveImgBtn = document.querySelector(".save-img"),
        resetFilterBtn = document.querySelector(".reset-filter");

        let brightness = "100", saturation = "100", inversion = "0", grayscale = "0";

        const applyFilters = () => {
            previewImg.style.filter = `brightness(${brightness}%) saturate(${saturation}%) invert(${inversion}%) grayscale(${grayscale}%)`;
        }

        const loadImage = () => {
            let file = fileInput.files[0];
            if(!file) return;
            previewImg.src = URL.createObjectURL(file);
            previewImg.addEventListener("load", () => {
                resetFilterBtn.click();
                container.classList.add("disable");
            });
        }

        filterOptions.forEach(option => {
            option.addEventListener("click", () => {
                document.querySelector(".active").classList.remove("active");
                option.classList.add("active");
                filterName.innerText = option.innerText;

                if(option.id === "brightness") {
                    filterSlider.max = "200";
                    filterSlider.value = brightness;
                    filterValue.innerText = `${brightness}%`;
                } else if(option.id === "saturation") {
                    filterSlider.max = "200";
                    filterSlider.value = saturation;
                    filterValue.innerText = `${saturation}%`;
                } else if(option.id === "inversion") {
                    filterSlider.max = "100";
                    filterSlider.value = inversion;
                    filterValue.innerText = `${inversion}%`;
                } else {
                    filterSlider.max = "100";
                    filterSlider.value = grayscale;
                    filterValue.innerText = `${grayscale}%`;
                }
            });
        });

        const updateFilter = () => {
            filterValue.innerText = `${filterSlider.value}%`;
            const selectedFilter = document.querySelector(".filter .active");

            if(selectedFilter.id === "brightness") {
                brightness = filterSlider.value;
            } else if(selectedFilter.id === "saturation") {
                saturation = filterSlider.value;
            } else if(selectedFilter.id === "inversion") {
                inversion = filterSlider.value;
            } else {
                grayscale = filterSlider.value;
            }
            applyFilters();
        }

        const saveImage = () => {
            if(!previewImg.src || previewImg.src === window.location.href) return; // Prevent saving empty image
            
            const canvas = document.createElement("canvas");
            const ctx = canvas.getContext("2d");
            canvas.width = previewImg.naturalWidth;
            canvas.height = previewImg.naturalHeight;
            
            ctx.filter = `brightness(${brightness}%) saturate(${saturation}%) invert(${inversion}%) grayscale(${grayscale}%)`;
            ctx.translate(canvas.width / 2, canvas.height / 2);
            ctx.drawImage(previewImg, -canvas.width / 2, -canvas.height / 2, canvas.width, canvas.height);
            
            const link = document.createElement("a");
            link.download = "SVSV-Edited-Image.jpg";
            link.href = canvas.toDataURL();
            link.click();
        }

        filterSlider.addEventListener("input", updateFilter);
        resetFilterBtn.addEventListener("click", () => {
            brightness = "100"; saturation = "100"; inversion = "0"; grayscale = "0";
            filterOptions[0].click();
            applyFilters();
        });
        
        fileInput.addEventListener("change", loadImage);
        chooseImgBtn.addEventListener("click", () => fileInput.click());
        saveImgBtn.addEventListener("click", saveImage);
    </script>
</body>
</html>

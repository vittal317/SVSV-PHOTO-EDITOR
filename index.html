<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SVSV PhotoShop Editor</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🖼️ SVSV PhotoShop Editor</h1>
            <p>Professional Photo Editing Tools - Fast, Free & Browser-Based</p>
        </header>

        <div class="main-content">
            <aside class="sidebar">
                <div class="tools-panel">
                    <h2>Editing Tools</h2>
                    
                    <div class="tool-group">
                        <h3>Basic Adjustments</h3>
                        <button class="tool-btn" onclick="setTool('brightness')">
                            <span class="icon">☀️</span> Brightness
                        </button>
                        <button class="tool-btn" onclick="setTool('contrast')">
                            <span class="icon">◐</span> Contrast
                        </button>
                        <button class="tool-btn" onclick="setTool('saturation')">
                            <span class="icon">🎨</span> Saturation
                        </button>
                        <button class="tool-btn" onclick="setTool('hue')">
                            <span class="icon">🌈</span> Hue
                        </button>
                        <button class="tool-btn" onclick="setTool('opacity')">
                            <span class="icon">👻</span> Opacity
                        </button>
                    </div>

                    <div class="tool-group">
                        <h3>Color Adjustments</h3>
                        <button class="tool-btn" onclick="setTool('grayscale')">
                            <span class="icon">⚫</span> Grayscale
                        </button>
                        <button class="tool-btn" onclick="setTool('sepia')">
                            <span class="icon">🟫</span> Sepia
                        </button>
                        <button class="tool-btn" onclick="setTool('invert')">
                            <span class="icon">⬜</span> Invert
                        </button>
                        <button class="tool-btn" onclick="setTool('blur')">
                            <span class="icon">💨</span> Blur
                        </button>
                    </div>

                    <div class="tool-group">
                        <h3>Transform Tools</h3>
                        <button class="tool-btn" onclick="setTool('rotate')">
                            <span class="icon">🔄</span> Rotate 90°
                        </button>
                        <button class="tool-btn" onclick="setTool('flip-h')">
                            <span class="icon">↔️</span> Flip H
                        </button>
                        <button class="tool-btn" onclick="setTool('flip-v')">
                            <span class="icon">↕️</span> Flip V
                        </button>
                        <button class="tool-btn" onclick="setTool('crop')">
                            <span class="icon">✂️</span> Crop
                        </button>
                    </div>

                    <div class="tool-group">
                        <h3>Effect Tools</h3>
                        <button class="tool-btn" onclick="setTool('sharpen')">
                            <span class="icon">🔍</span> Sharpen
                        </button>
                        <button class="tool-btn" onclick="setTool('emboss')">
                            <span class="icon">▲</span> Emboss
                        </button>
                        <button class="tool-btn" onclick="setTool('edge-detect')">
                            <span class="icon">📍</span> Edge Detect
                        </button>
                        <button class="tool-btn" onclick="setTool('pixelate')">
                            <span class="icon">⬜⬜</span> Pixelate
                        </button>
                    </div>

                    <div class="tool-group">
                        <h3>Filter Effects</h3>
                        <button class="tool-btn" onclick="setTool('vintage')">
                            <span class="icon">📷</span> Vintage
                        </button>
                        <button class="tool-btn" onclick="setTool('warm')">
                            <span class="icon">🔥</span> Warm
                        </button>
                        <button class="tool-btn" onclick="setTool('cool')">
                            <span class="icon">❄️</span> Cool
                        </button>
                    </div>
                </div>
            </aside>

            <main class="editor-area">
                <div class="canvas-container">
                    <canvas id="canvas"></canvas>
                    <div class="placeholder" id="placeholder">
                        <p>📤 Upload an image to start editing</p>
                    </div>
                </div>

                <div class="control-panel">
                    <div class="slider-group" id="sliderGroup" style="display: none;">
                        <label id="sliderLabel">Value:</label>
                        <input type="range" id="slider" min="0" max="200" value="100">
                        <span id="sliderValue">100</span>
                    </div>
                    <div class="button-group">
                        <button class="action-btn primary" onclick="uploadImage()">📁 Upload Image</button>
                        <button class="action-btn" onclick="downloadImage()">💾 Download</button>
                        <button class="action-btn" onclick="resetImage()">🔄 Reset</button>
                        <button class="action-btn" onclick="undoEdit()">↶ Undo</button>
                        <button class="action-btn" onclick="redoEdit()">↷ Redo</button>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <input type="file" id="imageInput" accept="image/*" style="display: none;">
    <script src="script.js"></script>
</body>
</html>
